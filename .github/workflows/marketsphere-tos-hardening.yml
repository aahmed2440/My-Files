name: MarketSphere Schwab/TOS Adapter Hardening

on:
  push:
    branches:
      - "hardening/marketsphere-tos-credential-boundary-2026-09-07"
      - "hardening/marketsphere-schwab-cert-v0.2-20260908"
    paths:
      - "deploy/marketsphere-tos-adapter/**"
      - ".github/workflows/marketsphere-tos-hardening.yml"
  pull_request:
    paths:
      - "deploy/marketsphere-tos-adapter/**"
      - ".github/workflows/marketsphere-tos-hardening.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: deploy/marketsphere-tos-adapter
    steps:
      - name: Check out immutable source
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Set up immutable Node action
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: "24"

      - name: Syntax checks
        run: npm run check

      - name: Protocol and state regression tests
        run: npm test

      - name: Verify no runtime NPM dependencies
        shell: bash
        run: |
          set -euo pipefail
          node - <<'NODE'
          const pkg = require('./package.json');
          const runtime = Object.keys(pkg.dependencies || {});
          if (runtime.length) throw new Error(`Unexpected runtime dependencies: ${runtime.join(', ')}`);
          console.log('No runtime NPM dependencies: PASS');
          NODE

      - name: Verify credential-boundary markers
        shell: bash
        run: |
          set -euo pipefail
          grep -q "SCHWAB_STREAM_HOST_ALLOWLIST" src/adapter.mjs
          grep -q "STREAMER_URL_PROTOCOL_REJECTED" src/adapter.mjs
          grep -q "PREFERENCE_RESPONSE_TOO_LARGE" src/adapter.mjs
          grep -q "TOS_EXPOSE_DIAGNOSTICS.*false" qtrust_bridge.mjs
          grep -q "QTRUST_BRIDGE_TRUST_FORWARD_HEADERS.*false" qtrust_bridge.mjs
          echo "Credential-boundary markers: PASS"

      - name: Verify fail-closed source-certification markers
        shell: bash
        run: |
          set -euo pipefail
          grep -q "SUBSCRIBED_AWAITING_DATA" src/state.mjs
          grep -q "ENTITLEMENT_PENDING" src/state.mjs
          grep -q "CONTINUITY_PENDING" src/state.mjs
          grep -q "sequenceGaps = null" src/state.mjs
          grep -q "automatic_live_promotion:false" src/state.mjs
          if grep -q "setMode('LIVE')" src/adapter.mjs; then
            echo '::error::Adapter must not promote SUBS/data directly to LIVE.'
            exit 1
          fi
          echo "Fail-closed source-certification markers: PASS"

      - name: Verify HTTP and bridge contracts cannot advertise automatic LIVE
        shell: bash
        run: |
          set -euo pipefail
          grep -q "required_for_governed_review" src/server.mjs
          grep -q "required_for_governed_review" qtrust_bridge.mjs
          grep -q "automatic_live_promotion: false" src/server.mjs
          grep -q "automatic_live_promotion:false" qtrust_bridge.mjs
          if grep -q "required_for_live" src/server.mjs qtrust_bridge.mjs; then
            echo '::error::Legacy required_for_live contract detected.'
            exit 1
          fi
          echo "HTTP/bridge certification contract: PASS"
