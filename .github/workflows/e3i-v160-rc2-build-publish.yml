name: E3I v160 RC2 — Build, Scan, Publish

on:
  workflow_dispatch:

permissions:
  contents: read
  packages: write
  id-token: write
  attestations: write

env:
  E3I_DIR: deploy/e3i/v160-rc2
  IMAGE: ghcr.io/${{ github.repository_owner }}/e3i

jobs:
  verify-build-publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22.23.2'
          cache: npm
          cache-dependency-path: deploy/e3i/v160-rc2/package-lock.json

      - name: Verify application
        working-directory: ${{ env.E3I_DIR }}
        run: |
          npm ci --ignore-scripts --no-fund
          npm test
          npm audit --omit=dev
          node --check app/server.js

      - name: Log in to Docker Hardened Images
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: dhi.io
          username: ${{ secrets.DHI_USERNAME }}
          password: ${{ secrets.DHI_TOKEN }}

      - name: Log in to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Build local RC2 image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: ${{ env.E3I_DIR }}
          file: ${{ env.E3I_DIR }}/Dockerfile
          load: true
          push: false
          tags: e3i:v160-rc2
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=v160-rc2

      - name: HIGH/CRITICAL image vulnerability policy
        uses: docker/scout-action@bacf462e8d090c09660de30a6ccc718035f961e3 # v1
        with:
          command: cves
          image: local://e3i:v160-rc2
          only-severities: critical,high
          exit-code: true

      - name: Tag and publish verified image
        id: publish
        shell: bash
        run: |
          set -euo pipefail
          SHA_TAG="v160-rc2-${GITHUB_SHA}"
          docker tag e3i:v160-rc2 "${IMAGE}:${SHA_TAG}"
          docker tag e3i:v160-rc2 "${IMAGE}:v160-rc2"
          docker push "${IMAGE}:${SHA_TAG}"
          docker push "${IMAGE}:v160-rc2"
          DIGEST="$(docker buildx imagetools inspect "${IMAGE}:${SHA_TAG}" --format '{{json .Manifest.Digest}}' | tr -d '"')"
          test -n "$DIGEST"
          echo "sha_tag=${SHA_TAG}" >> "$GITHUB_OUTPUT"
          echo "digest=${DIGEST}" >> "$GITHUB_OUTPUT"
          echo "Published ${IMAGE}:${SHA_TAG}@${DIGEST}"

      - name: Attest build provenance
        uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.publish.outputs.digest }}
          push-to-registry: true

      - name: Build summary
        run: |
          {
            echo '## E3I v160 RC2 image'
            echo
            echo "- Image: \`${IMAGE}:${{ steps.publish.outputs.sha_tag }}\`"
            echo "- Digest: \`${{ steps.publish.outputs.digest }}\`"
            echo '- App dependency audit: passed before publication'
            echo '- HIGH/CRITICAL image policy: passed before publication'
            echo '- Provenance attestation: generated'
            echo '- GitHub Action dependencies: pinned to immutable full commit SHAs'
            echo '- Production promotion: NOT performed by this workflow'
          } >> "$GITHUB_STEP_SUMMARY"
