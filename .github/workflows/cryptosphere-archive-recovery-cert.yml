name: CryptoSphere Archive Recovery Certification

on:
  pull_request:
    paths:
      - 'deploy/cryptosphere-integrated/**'
      - '.github/workflows/cryptosphere-archive-recovery-cert.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  recover-and-certify:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout immutable source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Recover verifiable ZIP local records without central directory
        shell: python
        run: |
          import binascii, pathlib, struct, zlib, zipfile, hashlib, shutil, os

          SOURCE = pathlib.Path('deploy/cryptosphere-integrated')
          SCRATCH = pathlib.Path('/tmp/cs-recovered')
          SCRATCH.mkdir(parents=True, exist_ok=True)

          LOCAL_SIG = 0x04034B50
          CENTRAL_SIG = 0x02014B50
          END_SIG = 0x06054B50

          def safe_name(name: str) -> pathlib.PurePosixPath:
              p = pathlib.PurePosixPath(name)
              if p.is_absolute() or '..' in p.parts or '\\' in name:
                  raise SystemExit(f'unsafe archive path: {name!r}')
              return p

          def recover(src: pathlib.Path, label: str):
              raw = src.read_bytes()
              observed = hashlib.sha256(raw).hexdigest()
              print(f'{label}: source_size={len(raw)} source_sha256={observed}')
              outdir = SCRATCH / label
              shutil.rmtree(outdir, ignore_errors=True)
              outdir.mkdir(parents=True)

              offset = 0
              entries = []
              while offset + 4 <= len(raw):
                  sig = struct.unpack_from('<I', raw, offset)[0]
                  if sig in (CENTRAL_SIG, END_SIG):
                      print(f'{label}: reached archive directory signature at offset={offset}')
                      break
                  if sig != LOCAL_SIG:
                      # We only trust a contiguous prefix of locally verifiable entries.
                      print(f'{label}: stopped at non-local signature offset={offset} sig=0x{sig:08x}')
                      break
                  if offset + 30 > len(raw):
                      print(f'{label}: truncated local header at offset={offset}')
                      break

                  (sig, ver, flags, method, mtime, mdate, crc_expected,
                   comp_size, uncomp_size, name_len, extra_len) = struct.unpack_from('<IHHHHHIIIHH', raw, offset)
                  header_end = offset + 30 + name_len + extra_len
                  if header_end > len(raw):
                      print(f'{label}: truncated name/extra at offset={offset}')
                      break
                  name_b = raw[offset+30:offset+30+name_len]
                  name = name_b.decode('utf-8', errors='strict')
                  p = safe_name(name)

                  # Bit 3 means sizes/CRC follow in a data descriptor; without the
                  # central directory boundary recovery is ambiguous, so fail closed.
                  if flags & 0x0008:
                      raise SystemExit(f'{label}: data-descriptor entry cannot be safely reconstructed: {name}')
                  if flags & 0x0001:
                      raise SystemExit(f'{label}: encrypted entry prohibited: {name}')

                  data_start = header_end
                  data_end = data_start + comp_size
                  if data_end > len(raw):
                      print(f'{label}: truncated data for {name!r}; stopping before partial entry')
                      break
                  comp = raw[data_start:data_end]
                  if method == 0:
                      plain = comp
                  elif method == 8:
                      plain = zlib.decompress(comp, -15)
                  else:
                      raise SystemExit(f'{label}: unsupported compression method={method} for {name}')

                  if len(plain) != uncomp_size:
                      raise SystemExit(f'{label}: size mismatch for {name}: {len(plain)} != {uncomp_size}')
                  crc_actual = binascii.crc32(plain) & 0xffffffff
                  if crc_actual != crc_expected:
                      raise SystemExit(f'{label}: CRC mismatch for {name}: {crc_actual:08x} != {crc_expected:08x}')

                  dest = outdir.joinpath(*p.parts)
                  if name.endswith('/'):
                      dest.mkdir(parents=True, exist_ok=True)
                  else:
                      dest.parent.mkdir(parents=True, exist_ok=True)
                      dest.write_bytes(plain)
                  entries.append((name, len(plain), hashlib.sha256(plain).hexdigest()))
                  offset = data_end

              if not entries:
                  raise SystemExit(f'{label}: no complete verifiable entries recovered')

              manifest = SCRATCH / f'{label}-entries.txt'
              manifest.write_text(''.join(f'{sha}  {size:>8}  {name}\n' for name, size, sha in entries))
              print(f'{label}: recovered_complete_entries={len(entries)} stopped_offset={offset}/{len(raw)}')
              print(manifest.read_text())

              # Deterministic forensic ZIP: fixed timestamp, permissions and entry order.
              outzip = SCRATCH / f'cryptosphere-{label}-runtime.zip'
              with zipfile.ZipFile(outzip, 'w', compression=zipfile.ZIP_DEFLATED, compresslevel=9) as z:
                  for path in sorted(x for x in outdir.rglob('*') if x.is_file()):
                      rel = path.relative_to(outdir).as_posix()
                      info = zipfile.ZipInfo(rel, date_time=(1980,1,1,0,0,0))
                      info.compress_type = zipfile.ZIP_DEFLATED
                      info.external_attr = 0o100644 << 16
                      info.create_system = 3
                      z.writestr(info, path.read_bytes(), compress_type=zipfile.ZIP_DEFLATED, compresslevel=9)
              with zipfile.ZipFile(outzip) as z:
                  bad = z.testzip()
                  if bad:
                      raise SystemExit(f'{label}: reconstructed CRC failure at {bad}')
              print(f'{label}: reconstructed_sha256={hashlib.sha256(outzip.read_bytes()).hexdigest()} reconstructed_size={outzip.stat().st_size}')
              return outzip

          recover(SOURCE/'cryptosphere-owner-runtime.zip', 'owner')
          recover(SOURCE/'cryptosphere-core-runtime.zip', 'core')

      - name: Require runtime-critical recovered files
        shell: bash
        run: |
          set -euo pipefail
          test -f /tmp/cs-recovered/owner/server.mjs
          test -f /tmp/cs-recovered/owner/package.json
          test -f /tmp/cs-recovered/core/server.py
          test -f /tmp/cs-recovered/core/requirements.txt
          echo 'Runtime-critical recovered files: PASS'

      - name: Create isolated recovered build context
        shell: bash
        run: |
          set -euo pipefail
          cp -a deploy/cryptosphere-integrated /tmp/cs-build
          cp /tmp/cs-recovered/cryptosphere-owner-runtime.zip /tmp/cs-build/cryptosphere-owner-runtime.zip
          cp /tmp/cs-recovered/cryptosphere-core-runtime.zip /tmp/cs-build/cryptosphere-core-runtime.zip
          (
            cd /tmp/cs-build
            sha256sum cryptosphere-owner-runtime.zip cryptosphere-core-runtime.zip > SHA256.txt
            cat SHA256.txt
          )
          echo 'NOTE: scratch SHA256.txt is certification-only and does not alter the approved repository manifest.'

      - name: Build recovered runtime image for certification only
        run: docker build --pull --tag cryptosphere-recovered:cert /tmp/cs-build

      - name: Verify image runs as non-root
        run: |
          set -euo pipefail
          uid="$(docker run --rm --entrypoint sh cryptosphere-recovered:cert -c 'id -u')"
          echo "container_uid=$uid"
          test "$uid" != '0'

      - name: Boot recovered runtime in isolated local container
        run: docker run -d --name cryptosphere-recovered-cert -p 127.0.0.1:18081:8080 cryptosphere-recovered:cert

      - name: Verify recovered integrated runtime readiness
        shell: bash
        run: |
          set -euo pipefail
          ready=0
          for i in $(seq 1 30); do
            code="$(curl -sS -o /tmp/recovered-health.json -w '%{http_code}' http://127.0.0.1:18081/health || true)"
            if [ "$code" = '200' ]; then ready=1; break; fi
            sleep 2
          done
          cat /tmp/recovered-health.json 2>/dev/null || true
          if [ "$ready" != '1' ]; then
            echo '::error::Recovered runtime did not reach aggregate readiness.'
            docker logs cryptosphere-recovered-cert || true
            exit 1
          fi

      - name: Enforce recovered runtime governance boundary
        shell: python
        run: |
          import json, urllib.request
          with urllib.request.urlopen('http://127.0.0.1:18081/health', timeout=5) as r:
              d=json.load(r)
          assert d.get('product') == 'CryptoSphere'
          assert d.get('status') == 'ready'
          assert d.get('production_execution') is False
          assert d.get('production_mutation') is False
          assert d.get('arbitrary_scanning') is False
          assert d.get('human_governance_required') is True
          assert d.get('analytical_core',{}).get('mode') == 'ADVISORY_ONLY'
          print('Recovered runtime governance boundary: PASS')

      - name: Verify mutation remains blocked
        shell: bash
        run: |
          set -euo pipefail
          code="$(curl -sS -o /tmp/blocked.json -w '%{http_code}' -X POST http://127.0.0.1:18081/core/api/v1/health)"
          cat /tmp/blocked.json
          test "$code" = '405'
          grep -q METHOD_NOT_ALLOWED /tmp/blocked.json

      - name: Report forensic outcome
        if: always()
        shell: bash
        run: |
          {
            echo '## CryptoSphere bounded archive recovery certification'
            echo '- Recovery uses only complete ZIP local records with verified size + CRC.'
            echo '- Partial/truncated entries, encrypted entries, data-descriptor ambiguity, and unsafe paths fail closed.'
            echo '- Deterministic reconstructed ZIPs are forensic/certification artifacts only.'
            echo '- This run does NOT bless reconstructed bytes as release artifacts.'
            echo '- This run does NOT modify or deploy production.'
          } >> "$GITHUB_STEP_SUMMARY"
          docker logs cryptosphere-recovered-cert > /tmp/cryptosphere-recovered-cert.log 2>&1 || true

      - name: Stop isolated container
        if: always()
        run: docker rm -f cryptosphere-recovered-cert >/dev/null 2>&1 || true
