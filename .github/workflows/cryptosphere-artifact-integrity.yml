name: CryptoSphere Artifact Integrity Canary

on:
  push:
    branches:
      - "cryptosphere/docker-canary-2026-09-07"
    paths:
      - "Dockerfile"
      - "deploy/cryptosphere-integrated/**"
      - ".github/workflows/cryptosphere-artifact-integrity.yml"
  pull_request:
    paths:
      - "Dockerfile"
      - "deploy/cryptosphere-integrated/**"
      - ".github/workflows/cryptosphere-artifact-integrity.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-release-bytes:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Print committed artifact hashes
        shell: bash
        run: |
          set -euo pipefail
          cd deploy/cryptosphere-integrated
          sha256sum cryptosphere-owner-runtime.zip cryptosphere-core-runtime.zip gateway.mjs

      - name: Verify committed release manifest
        id: manifest
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          cd deploy/cryptosphere-integrated
          sha256sum -c SHA256.txt

      - name: Verify ZIP structure independently
        shell: bash
        run: |
          set -euo pipefail
          cd deploy/cryptosphere-integrated
          unzip -t cryptosphere-owner-runtime.zip
          unzip -t cryptosphere-core-runtime.zip

      - name: Record manifest gate
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ steps.manifest.outcome }}" != "success" ]; then
            echo "CryptoSphere release manifest is stale or inconsistent with committed artifacts" >&2
            exit 1
          fi

      - name: Build checksum-enforced Docker canary
        if: success()
        run: docker build --no-cache -t cryptosphere-integrity-canary:local .
