name: E3I v160 RC2 — Source Verification

on:
  pull_request:
    paths:
      - 'deploy/e3i/v160-rc2/**'
      - '.github/workflows/e3i-v160-rc2-*.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: deploy/e3i/v160-rc2
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22.23.2'
          cache: npm
          cache-dependency-path: deploy/e3i/v160-rc2/package-lock.json

      - name: Install from lockfile
        run: npm ci --ignore-scripts --no-fund

      - name: Invariant regression
        run: npm test

      - name: Dependency audit
        run: npm audit --omit=dev

      - name: JavaScript syntax
        run: node --check app/server.js
