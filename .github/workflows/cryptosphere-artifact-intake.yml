name: CryptoSphere — Artifact Intake Gate

on:
  pull_request:
    paths:
      - 'deploy/cryptosphere-integrated/cryptosphere-owner-runtime.zip'
      - 'deploy/cryptosphere-integrated/cryptosphere-core-runtime.zip'
      - 'deploy/cryptosphere-integrated/SHA256.txt'
      - 'deploy/cryptosphere-integrated/verify-pilot-artifacts.sh'
      - '.github/workflows/cryptosphere-artifact-intake.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  artifact-intake:
    name: Exact approved Pilot artifacts
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout immutable action
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Verify approved bytes, digests, ZIPs, and manifest
        shell: bash
        run: |
          set -euo pipefail
          bash deploy/cryptosphere-integrated/verify-pilot-artifacts.sh

      - name: Record authority boundary
        if: always()
        shell: bash
        run: |
          {
            echo '## CryptoSphere Artifact Intake Gate'
            echo
            echo '- Exact approved byte counts are enforced before runtime certification.'
            echo '- Exact SHA-256 digests are enforced.'
            echo '- ZIP integrity is enforced.'
            echo '- SHA256.txt must bind the approved bytes.'
            echo '- The manifest is never rewritten to bless mismatched artifacts.'
            echo '- This gate performs no deployment, promotion, external contact, production mutation, or authority increase.'
          } >> "$GITHUB_STEP_SUMMARY"
