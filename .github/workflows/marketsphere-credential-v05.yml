name: MarketSphere Credential Integrity v0.5

on:
  push:
    branches:
      - "hardening/marketsphere-credential-lifecycle-v0.5-20260909"
    paths:
      - "deploy/marketsphere-tos-adapter/**"
      - ".github/workflows/marketsphere-credential-v05.yml"
  pull_request:
    paths:
      - "deploy/marketsphere-tos-adapter/**"
      - ".github/workflows/marketsphere-credential-v05.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  credential-integrity:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: deploy/marketsphere-tos-adapter
    steps:
      - name: Check out immutable source
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Set up immutable Node action
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: "24"

      - name: Emit v0.5 runtime fingerprints
        shell: bash
        run: |
          set -euo pipefail
          sha256sum src/state.mjs src/adapter.mjs src/historian.mjs src/historian_adapter.mjs src/credential_guard.mjs src/server.mjs

      - name: Syntax checks
        run: npm run check

      - name: Full regression suite
        run: npm test

      - name: Verify credential and historian risk-off gates
        shell: bash
        run: |
          set -euo pipefail
          grep -q "TOKEN_EXPIRY_UNVERIFIED" src/credential_guard.mjs
          grep -q "TOKEN_EXPIRING" src/credential_guard.mjs
          grep -q "TOKEN_EXPIRED" src/credential_guard.mjs
          grep -q "PROCESS_ENV_ONLY" src/credential_guard.mjs
          grep -q "persistence: 'PROHIBITED'" src/credential_guard.mjs
          grep -q "logging: 'PROHIBITED'" src/credential_guard.mjs
          grep -q "access_token_value_exposed: false" src/credential_guard.mjs
          grep -q "const accepted = super.onMessage" src/historian_adapter.mjs
          grep -q "if (!accepted" src/historian_adapter.mjs
          grep -q "/api/v1/credential/status" src/server.mjs
          grep -q "trading_authority: 'NONE'" src/server.mjs
          grep -q "automatic_live_promotion: false" src/server.mjs
          if grep -R "SCHWAB_ACCESS_TOKEN" -n src/historian.mjs src/historian_adapter.mjs src/server.mjs; then
            echo '::error::Historian/server code must not read broker access tokens.'
            exit 1
          fi
          if grep -R -E "console\.(log|error|warn).*token|console\.(log|error|warn).*authorization" -ni src; then
            echo '::error::Credential material must never be logged.'
            exit 1
          fi
          if grep -R -E "trading_authority: '(FULL|ORDER|TRADING)'|production_mutation: true|automatic_live_promotion: true" -n src; then
            echo '::error::Authority escalation is prohibited.'
            exit 1
          fi
          echo "MarketSphere v0.5 credential integrity gates: PASS"
